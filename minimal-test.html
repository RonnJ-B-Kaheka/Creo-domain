<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Navbar Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: #333;
            color: white;
            z-index: 1000;
        }
        
        .nav-open-btn {
            background: white;
            color: black;
            border: none;
            padding: 10px;
            font-size: 24px;
            cursor: pointer;
            display: block;
        }
        
        .navbar {
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1001;
        }
        
        .navbar.active {
            transform: translateX(0);
        }
        
        .nav-close-btn {
            background: transparent;
            color: white;
            border: none;
            padding: 10px;
            font-size: 24px;
            cursor: pointer;
            float: right;
        }
        
        .navbar-list {
            list-style: none;
            padding: 60px 20px 20px;
        }
        
        .navbar-link {
            display: block;
            color: white;
            padding: 15px 0;
            text-decoration: none;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>

<body>
    <header class="header" data-header>
        <button class="nav-open-btn" data-nav-toggler>☰</button>

        <nav class="navbar" data-navbar>
            <button class="nav-close-btn" data-nav-toggler>X</button>
            <ul class="navbar-list">
                <li><a href="#" class="navbar-link" data-nav-link>Home</a></li>
                <li><a href="#" class="navbar-link" data-nav-link>About</a></li>
                <li><a href="#" class="navbar-link" data-nav-link>Services</a></li>
                <li><a href="#" class="navbar-link" data-nav-link>Contact</a></li>
            </ul>
        </nav>

        <div class="overlay" data-nav-toggler data-overlay></div>
    </header>

    <main style="margin-top: 100px; padding: 20px;">
        <h1>Minimal Navbar Test</h1>
        <p>Click the hamburger menu (☰) button to test the navbar functionality.</p>
        <p>If this works, then the issue is with the original CSS/JS implementation.</p>

        <div style="margin-top: 50px;">
            <h2>Console Output:</h2>
            <div id="console-output" style="background: #f5f5f5; padding: 10px; border-radius: 4px; min-height: 100px; font-family: monospace;"></div>
        </div>
    </main>

    <script>
        // Simple navbar implementation for testing
        const consoleOutput = document.getElementById('console-output');

        function log(message) {
            console.log(message);
            consoleOutput.innerHTML += message + '<br>';
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        log('=== MINIMAL NAVBAR TEST ===');

        // Select elements
        const navbar = document.querySelector('[data-navbar]');
        const navTogglers = document.querySelectorAll('[data-nav-toggler]');
        const overlay = document.querySelector('[data-overlay]');

        log(`Navbar found: ${!!navbar}`);
        log(`Nav togglers found: ${navTogglers.length}`);
        log(`Overlay found: ${!!overlay}`);

        // Toggle function
        function toggleNavbar() {
            log('Toggle function called');
            if (navbar) {
                navbar.classList.toggle('active');
                log(`Navbar active: ${navbar.classList.contains('active')}`);
            }
            if (overlay) {
                overlay.classList.toggle('active');
                log(`Overlay active: ${overlay.classList.contains('active')}`);
            }
        }

        // Attach event listeners
        if (navTogglers.length > 0) {
            navTogglers.forEach(toggler => {
                toggler.addEventListener('click', toggleNavbar);
            });
            log('Event listeners attached');
        } else {
            log('ERROR: No nav togglers found');
        }

        log('Initialization complete');
    </script>
</body>

</html>
